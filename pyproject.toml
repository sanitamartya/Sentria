[project]
name = "sentria"
version = "0.1.0"
description = "AI Engineering and Operations System"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.4",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
